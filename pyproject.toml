[project]
name = "omv-mcp"
version = "0.1.0"
description = "MCP server for managing an OpenMediaVault NAS. Runs ON the NAS; consumed over stdio-over-SSH."
license = { file = "LICENSE" }
authors = [{ name = "Naveen Busiraju" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
omv-mcp = "omv_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omv_mcp"]

[tool.uv]
# Pin a standalone CPython 3.12 (NAS system python is 3.9, too old for the mcp SDK).
