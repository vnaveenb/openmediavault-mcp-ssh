# Publishes to PyPI via Trusted Publishing (OIDC — no API tokens).
# Trigger: push a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# One-time PyPI side: add a publisher for project `omv-mcp` pointing at
# this repo, workflow `publish.yml`, environment `pypi`.

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
